apiVersion: v1
kind: Service
metadata:
  name: db # Matches the DB_HOST 'db' used in ConfigMap for DNS resolution
  labels:
    app: caresync
    tier: db
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: caresync
    tier: db
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: caresync-web-service
  labels:
    app: caresync
    tier: web
spec:
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 # Allows browser access under Minikube via node IP:30080
  selector:
    app: caresync
    tier: web
  type: NodePort
